<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería Fotográfica - Sociedad Uruguaya de Nefrología</title>

  <!-- Bootstrap 5 CSS e Iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <style>
    /* Estilos del Cabezal compacto (120px) */
    .header-container {
      position: relative;
      overflow: hidden;
      border-radius: 0.375rem;
      height: 120px;
    }

    .header-img {
      height: 100%;
      object-fit: cover;
      width: 100%;
      display: block;
    }

    .header-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      top: 0;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .header-overlay h1 {
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      font-size: 1.5rem;
    }

    /* Botones de Acción e Indicadores con ancho uniforme */
    .btn-sun-action, #gallery-counter {
      background-color: #0056b3;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-weight: 600;
      font-size: 0.825rem;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      flex: 1 1 0px;
      min-width: 140px;
    }

    #gallery-counter {
      background-color: #6c757d; /* Gris distintivo para el contador */
      border-color: transparent;
      cursor: default;
    }

    .btn-sun-action:hover {
      background-color: #003366;
      color: #ffffff;
      border-color: #ffffff;
    }

    /* CONTENEDOR DEL VISOR DE GALERÍA CON FLECHAS CIRCULARES FLOTANTES */
    .gallery-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .gallery-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 520px;
      height: 65vh;
      background-color: #f8f9fa;
      border-radius: 0.375rem;
      padding: 15px 5px;
      overflow: hidden;
      width: 100%;
    }

    /* Pista de Scroll Horizontal */
    .gallery-track {
      display: flex;
      overflow-x: auto;
      scroll-behavior: smooth;
      scroll-snap-type: x mandatory;
      width: 100%;
      height: 100%;
      align-items: center;
      scrollbar-width: none;
    }

    .gallery-track::-webkit-scrollbar {
      display: none;
    }

    /* Diapositiva individual */
    .gallery-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      scroll-snap-align: center;
      padding: 0 10px;
    }

    .gallery-item {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    /* Botones Circulares Estilo SUN Flotantes */
    .btn-sun-circle {
      background-color: #58a7f6;
      color: #ffffff;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: all 0.2s ease;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      flex-shrink: 0;
      z-index: 10;
    }

    .btn-sun-circle:hover {
      background-color: #0056b3;
      color: #ffffff;
      transform: scale(1.08);
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }

    /* Ajustes móviles */
    @media (max-width: 768px) {
      .btn-sun-circle {
        width: 36px;
        height: 36px;
        font-size: 1rem;
      }
      .gallery-wrapper {
        gap: 5px;
      }
      .action-bar-container {
        justify-content: center !important;
        width: 100%;
      }
      .action-buttons-group {
        width: 100%;
        display: grid !important;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px !important;
      }
      .btn-sun-action, #gallery-counter {
        width: 100%;
        min-width: 0;
      }
      .gallery-viewport {
        padding: 10px 2px;
        min-height: 380px;
        height: 50vh;
      }
    }
  </style>
</head>
<body class="bg-light">

  <main class="container-fluid my-3 px-2 px-md-5" style="max-width: 1300px;">

    <!-- Navegación -->
    <nav aria-label="breadcrumb" class="mb-3 d-flex align-items-center gap-2">
      <a href="index.html" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Volver a Inicio
      </a>
    </nav>

    <!-- Ficha Principal -->
    <article class="bg-white p-3 p-md-4 rounded shadow-sm border">

      <!-- Encabezado con cabezal compacto -->
      <header class="pb-2 mb-3 border-bottom">
        <div class="header-container mb-2">
          <img src="img/cientifico.jpg" alt="Portada Galería SUN" class="header-img">

          <div class="header-overlay">
            <span class="badge bg-primary mb-1" style="font-size: 0.75rem;">Registro Fotográfico</span>
            <h1 class="fw-bold text-white mb-0" id="gallery-title-text">Imágenes de SUN</h1>
          </div>
        </div>

        <!-- LÍNEA DE ACCIONES E INDICADOR DE ELEMENTOS -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-1 action-bar-container">
          <p class="text-muted small mb-0">Galería de imágenes y registros en video de las actividades institucionales.</p>

          <div class="d-flex align-items-center gap-2 action-buttons-group">
            <!-- Contador de Elementos -->
            <span id="gallery-counter">Cargando...</span>

            <!-- Botón Primera Foto -->
            <button id="btn-first-item" class="btn-sun-action" title="Ir al Inicio de la Galería">
              <i class="bi bi-images"></i> Inicio
            </button>

            <!-- Pantalla Completa -->
            <button id="btn-fullscreen" class="btn-sun-action">
              <i class="bi bi-arrows-angle-expand"></i> Pantalla Completa
            </button>
          </div>
        </div>
      </header>

      <!-- ÁREA DE LA GALERÍA + FLECHAS CIRCULARES -->
      <div class="gallery-wrapper">
        <button id="btn-prev" class="btn-sun-circle" title="Anterior">
          <i class="bi bi-chevron-left"></i>
        </button>

        <section class="gallery-viewport border" id="viewport-container">
          <div class="gallery-track" id="galleryTrack">
            
            <div class="gallery-slide"><img src="galeria/WhatsApp Image 2026-08-19 at 4.49.25 PM.jpg" class="gallery-item" alt="Registro fotográfico 1"></div>
            <div class="gallery-slide"><img src="galeria/WhatsApp Image 2026-08-19 at 4.49.31 PM 1.jpg" class="gallery-item" alt="Registro fotográfico 2"></div>
            <div class="gallery-slide"><img src="galeria/WhatsApp Image 2026-08-19 at 4.49.31 PM.jpg" class="gallery-item" alt="Registro fotográfico 3"></div>
            <div class="gallery-slide"><img src="galeria/WhatsApp Image 2026-08-19 at 4.49.32 PM.jpg" class="gallery-item" alt="Registro fotográfico 4"></div>
            <div class="gallery-slide"><img src="galeria/WhatsApp Image 2026-08-19 at 4.49.33 PM.jpg" class="gallery-item" alt="Registro fotográfico 5"></div>
            <div class="gallery-slide"><img src="galeria/WhatsApp Image 2026-08-19 at 4.49.34 PM.jpg" class="gallery-item" alt="Registro fotográfico 6"></div>
            <div class="gallery-slide"><img src="galeria/WhatsApp Image 2026-08-19 at 4.49.35 PM.jpg" class="gallery-item" alt="Registro fotográfico 7"></div>
            <div class="gallery-slide"><img src="galeria/WhatsApp Image 2026-08-19 at 4.49.36 PM.jpg" class="gallery-item" alt="Registro fotográfico 8"></div>
            <div class="gallery-slide"><img src="galeria/WhatsApp Image 2026-08-19 at 4.50.03 PM 1.jpg" class="gallery-item" alt="Registro fotográfico 9"></div>
            <div class="gallery-slide"><img src="galeria/WhatsApp Image 2026-08-19 at 4.50.04 PM.jpg" class="gallery-item" alt="Registro fotográfico 10"></div>
            <div class="gallery-slide"><img src="galeria/WhatsApp Image 2026-08-19 at 4.50.05 PM.jpg" class="gallery-item" alt="Registro fotográfico 11"></div>
            
            <!-- Video MP4 -->
            <div class="gallery-slide">
              <video controls class="gallery-item">
                <source src="galeria/WhatsApp Video 2026-08-19 at 4.49.21 PM.mp4" type="video/mp4">
                Tu navegador no soporta la reproducción de video.
              </video>
            </div>

          </div>
        </section>

        <button id="btn-next" class="btn-sun-circle" title="Siguiente">
          <i class="bi bi-chevron-right"></i>
        </button>
      </div>

      <!-- Pie de página -->
      <footer class="border-top pt-3 mt-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <span class="text-muted small">Sociedad Uruguaya de Nefrología</span>
        <a href="index.html" class="btn btn-sm btn-outline-primary fw-bold">
          Sitio Oficial SUN <i class="bi bi-box-arrow-up-right ms-1"></i>
        </a>
      </footer>

    </article>

  </main>

  <!-- JS de Bootstrap 5 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const track = document.getElementById('galleryTrack');
      const btnLeft = document.getElementById('btn-prev');
      const btnRight = document.getElementById('btn-next');
      const btnFirst = document.getElementById('btn-first-item');
      const btnFullscreen = document.getElementById('btn-fullscreen');
      const counterEl = document.getElementById('gallery-counter');
      const slides = track.querySelectorAll('.gallery-slide');
      const totalItems = slides.length;

      // Actualizar contador según el scroll activo
      function updateCounter() {
        const index = Math.round(track.scrollLeft / track.clientWidth) + 1;
        counterEl.innerText = `Foto ${Math.min(index, totalItems)} de ${totalItems}`;
      }

      // Navegación con Flechas Laterales
      btnRight.addEventListener('click', () => {
        track.scrollBy({ left: track.clientWidth, behavior: 'smooth' });
      });

      btnLeft.addEventListener('click', () => {
        track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' });
      });

      // Ir al Inicio
      btnFirst.addEventListener('click', () => {
        track.scrollTo({ left: 0, behavior: 'smooth' });
      });

      // Pantalla Completa
      btnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
        }
      });

      // Evento de scroll para actualizar la numeración automáticamente
      track.addEventListener('scroll', updateCounter);

      // Inicializar contador
      updateCounter();
    });
  </script>
</body>
</html>
