<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Publicaciones - Sociedad Uruguaya de Nefrología</title>
  
  <!-- Bootstrap 5 CSS e Iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <!-- Librería StPageFlip CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/css/page-flip.min.css">

  <style>
    /* Estilos del Cabezal compacto (120px) */
    .header-container {
      position: relative;
      overflow: hidden;
      border-radius: 0.375rem;
      height: 120px;
    }

    .header-img {
      height: 100%;
      object-fit: cover;
      width: 100%;
      display: block;
    }

    .header-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      top: 0;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .header-overlay h1 {
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      font-size: 1.5rem;
    }

    /* Botones de Acción Azules Institucionales */
    .btn-sun-action {
      background-color: #0056b3;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-weight: 600;
      font-size: 0.825rem;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-sun-action:hover {
      background-color: #003366;
      color: #ffffff;
      border-color: #ffffff;
    }

    /* CONTENEDOR DEL VISOR CON FLECHAS CIRCULARES FLOTANTES ALINEADAS */
    .flipbook-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .flipbook-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 520px;
      background-color: #f8f9fa;
      border-radius: 0.375rem;
      padding: 15px 5px;
      overflow: hidden;
      width: 100%;
    }

    /* Botones Circulares Estilo SUN Flotantes */
    .btn-sun-circle {
      background-color: #58a7f6;
      color: #ffffff;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: all 0.2s ease;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      flex-shrink: 0;
      z-index: 10;
    }

    .btn-sun-circle:hover {
      background-color: #0056b3;
      color: #ffffff;
      transform: scale(1.08);
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }

    #loading-status {
      position: absolute;
      font-weight: 600;
      z-index: 50;
    }

    .flipbook-container {
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.5s ease;
      background-color: #ffffff;
      max-width: 100%;
      margin: 0 auto;
    }

    .flipbook-container.loaded {
      opacity: 1;
    }

    /* Estilos adaptativos de las páginas y canvas para evitar cortes */
    .page {
      background-color: #ffffff;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .page canvas {
      max-width: 100% !important;
      max-height: 100% !important;
      width: auto !important;
      height: auto !important;
      object-fit: contain;
      display: block;
    }

    /* Ajustes específicos para pantallas de celular */
    @media (max-width: 768px) {
      .btn-sun-circle {
        width: 36px;
        height: 36px;
        font-size: 1rem;
      }
      .flipbook-wrapper {
        gap: 5px;
      }

      /* Distribución de la barra de acciones en dos filas para celulares */
      .action-bar-container {
        justify-content: center !important;
        width: 100%;
      }
      .action-buttons-group {
        width: 100%;
        justify-content: center;
        flex-wrap: wrap !important;
      }
      /* Los dos últimos botones bajan a la 2ª fila en mobile */
      #btn-fullscreen, #btn-download {
        flex: 1 1 calc(50% - 8px);
        text-align: center;
      }
    }
  </style>
</head>
<body class="bg-light">

  <main class="container-fluid my-3 px-2 px-md-5" style="max-width: 1300px;">
    
    <!-- Botones de retorno a nivel de sitio web -->
    <nav aria-label="breadcrumb" class="mb-3 d-flex align-items-center gap-2">
      <a href="index.html" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Volver a Inicio
      </a>
    </nav>

    <!-- Ficha Principal estilo Documento Ampliada -->
    <article class="bg-white p-3 p-md-4 rounded shadow-sm border">
      
      <!-- Encabezado con cabezal compacto (120px) -->
      <header class="pb-2 mb-3 border-bottom">
        <div class="header-container mb-2">
          <img src="img/cientifico.jpg" alt="Publicación SUN" class="header-img">
          
          <div class="header-overlay">
            <span class="badge bg-primary mb-1" style="font-size: 0.75rem;">Publicación Interactiva</span>
            <h1 class="fw-bold text-white mb-0" id="doc-title-text">Revista SUN</h1>
          </div>
        </div>

        <!-- LÍNEA COMPACTA CON TODAS LAS ACCIONES E INDICADOR DE PÁGINA -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-1 action-bar-container">
          <p class="text-muted small mb-0">Podés hojear el documento en pantalla o descargarlo en formato PDF original.</p>
          
          <div class="d-flex align-items-center gap-2 action-buttons-group">
            <!-- Contador de Paginado -->
            <span id="page-num" class="badge bg-secondary px-3 py-2 fs-6">Cargando...</span>

            <!-- Botón para volver a la Página 1 Interna -->
            <button id="btn-first-page" class="btn-sun-action" title="Ir a la Portada / Primera Página">
              <i class="bi bi-journal-arrow-up"></i> Pág. 1
            </button>

            <!-- Pantalla Completa -->
            <button id="btn-fullscreen" class="btn-sun-action">
              <i class="bi bi-arrows-angle-expand"></i> Pantalla Completa
            </button>

            <!-- Descargar PDF -->
            <a id="btn-download" href="#" download class="btn-sun-action">
              <i class="bi bi-download"></i> Descargar PDF
            </a>
          </div>
        </div>
      </header>

      <!-- ÁREA DEL LIBRO INTERACTIVO + FLECHAS CIRCULARES LATERALES -->
      <div class="flipbook-wrapper">
        <!-- Flecha Izquierda (Anterior) -->
        <button id="btn-prev" class="btn-sun-circle" title="Página Anterior">
          <i class="bi bi-chevron-left"></i>
        </button>

        <!-- Contenedor del Flipbook -->
        <section class="flipbook-viewport border">
          <div id="loading-status" class="alert alert-info mb-0">
            <i class="bi bi-arrow-repeat spin me-2"></i> Procesando documento interactivo...
          </div>
          <div id="my-flipbook" class="flipbook-container"></div>
        </section>

        <!-- Flecha Derecha (Siguiente) -->
        <button id="btn-next" class="btn-sun-circle" title="Página Siguiente">
          <i class="bi bi-chevron-right"></i>
        </button>
      </div>

      <!-- Pie de página de la ficha -->
      <footer class="border-top pt-3 mt-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <span class="text-muted small">Sociedad Uruguaya de Nefrología</span>
        <a href="index.html" class="btn btn-sm btn-outline-primary fw-bold">
          Sitio Oficial SUN <i class="bi bi-box-arrow-up-right ms-1"></i>
        </a>
      </footer>

    </article>

  </main>

  <!-- JS de Bootstrap 5 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- LIBRERÍAS DE FLIPBOOK (PDF.js + StPageFlip) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <script>
    // Configurar Worker de PDF.js
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // Obtener ruta del PDF desde la URL o usar valor por defecto
    const urlParams = new URLSearchParams(window.location.search);
    const pdfPath = urlParams.get('doc') || 'pdf/estatutos.pdf';

    document.getElementById('btn-download').href = pdfPath;

    let pageFlip = null;

    async function initPDFViewer() {
      const loadingEl = document.getElementById('loading-status');
      const container = document.getElementById('my-flipbook');

      try {
        const loadingTask = pdfjsLib.getDocument(pdfPath);
        const pdfDoc = await loadingTask.promise;
        const totalPages = pdfDoc.numPages;

        // Renderizar cada página en el Canvas a alta resolución (2.0)
        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          const page = await pdfDoc.getPage(pageNum);
          const viewport = page.getViewport({ scale: 2.0 });

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';

          // Marcar la primera página como portada para evitar la vista previa previa de contraportada a la izquierda
          if (pageNum === 1) {
            pageDiv.setAttribute('data-density', 'hard');
          }

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          pageDiv.appendChild(canvas);
          container.appendChild(pageDiv);

          await page.render({ canvasContext: context, viewport: viewport }).promise;
        }

        const firstPage = await pdfDoc.getPage(1);
        const view = firstPage.getViewport({ scale: 1.0 });

        const isMobile = window.innerWidth <= 768;

        // Configuración adaptativa: Portada derecha en desktop (showCover: true), 1 página en mobile
        pageFlip = new St.PageFlip(container, {
          width: view.width,
          height: view.height,
          size: "stretch",
          minWidth: 280,
          maxWidth: 1000,
          minHeight: 380,
          maxHeight: 1200,
          maxShadowOpacity: 0.5,
          showCover: true,       // Muestra la Pág. 1 sola a la derecha en modo libro
          usePortrait: isMobile, // Activa el modo vista individual en celulares
          autoSize: true,
          mobileScrollSupport: false
        });

        pageFlip.loadFromHTML(document.querySelectorAll('.page'));

        loadingEl.style.display = 'none';
        container.classList.add('loaded');

        updatePageIndicator();

        pageFlip.on('flip', () => {
          updatePageIndicator();
        });

      } catch (error) {
        console.error('Error al cargar el PDF:', error);
        loadingEl.className = 'alert alert-danger mb-0';
        loadingEl.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i> Error al cargar el PDF. Revisa que el archivo exista en el servidor.';
      }
    }

    function updatePageIndicator() {
      if (!pageFlip) return;
      const current = pageFlip.getCurrentPageIndex() + 1;
      const total = pageFlip.getPageCount();
      document.getElementById('page-num').innerText = `Pág. ${current} de ${total}`;
    }

    // Controles de navegación lateral
    document.getElementById('btn-prev').addEventListener('click', () => {
      if (pageFlip) pageFlip.flipPrev();
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      if (pageFlip) pageFlip.flipNext();
    });

    // Control para ir a la Primera Página
    document.getElementById('btn-first-page').addEventListener('click', () => {
      if (pageFlip) pageFlip.flip(0);
    });

    // Control de Pantalla Completa
    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    // Recalcular dimensiones al cambiar el tamaño de ventana
    window.addEventListener('resize', () => {
      if (pageFlip) {
        pageFlip.updateFromHtml(document.querySelectorAll('.page'));
      }
    });

    window.addEventListener('DOMContentLoaded', initPDFViewer);
  </script>
</body>
</html>
