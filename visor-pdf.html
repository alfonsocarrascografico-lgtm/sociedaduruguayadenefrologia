<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Publicaciones - Sociedad Uruguaya de Nefrología</title>
  
  <!-- Bootstrap 5 CSS e Iconos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

  <style>
    /* Estilos del Cabezal compacto (120px) */
    .header-container {
      position: relative;
      overflow: hidden;
      border-radius: 0.375rem;
      height: 120px;
    }

    .header-img {
      height: 100%;
      object-fit: cover;
      width: 100%;
      display: block;
    }

    .header-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      top: 0;
      padding: 1rem 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
    }

    .header-overlay h1 {
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      font-size: 1.5rem;
    }

    /* Botones de Acción e Indicadores con ancho uniforme */
    .btn-sun-action, #page-num {
      background-color: #0056b3;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-weight: 600;
      font-size: 0.825rem;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      flex: 1 1 0px; /* Igualar el ancho exacto entre todos los elementos */
      min-width: 140px; /* Ancho uniforme para Desktop */
    }

    #page-num {
      background-color: #6c757d; /* Gris distintivo para el contador */
      border-color: transparent;
      cursor: default;
    }

    .btn-sun-action:hover {
      background-color: #003366;
      color: #ffffff;
      border-color: #ffffff;
    }

    /* CONTENEDOR DEL VISOR CON FLECHAS CIRCULARES FLOTANTES ALINEADAS */
    .flipbook-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .flipbook-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 480px;
      background-color: #f8f9fa;
      border-radius: 0.375rem;
      padding: 15px 5px;
      overflow: hidden;
      width: 100%;
    }

    /* Botones Circulares Estilo SUN Flotantes */
    .btn-sun-circle {
      background-color: #58a7f6;
      color: #ffffff;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      transition: all 0.2s ease;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      flex-shrink: 0;
      z-index: 10;
    }

    .btn-sun-circle:hover {
      background-color: #0056b3;
      color: #ffffff;
      transform: scale(1.08);
      box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    }

    #loading-status {
      position: absolute;
      font-weight: 600;
      z-index: 50;
    }

    /* Estilos Turn.js sin distorsión */
    #my-flipbook {
      margin: 0 auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    #my-flipbook.loaded {
      opacity: 1;
    }

    .page {
      background-color: #ffffff;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .page canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      object-fit: contain;
    }

    /* Ajustes móviles */
    @media (max-width: 768px) {
      .btn-sun-circle {
        width: 36px;
        height: 36px;
        font-size: 1rem;
      }
      .flipbook-wrapper {
        gap: 5px;
      }
      .action-bar-container {
        justify-content: center !important;
        width: 100%;
      }
      .action-buttons-group {
        width: 100%;
        display: grid !important;
        grid-template-columns: repeat(2, 1fr); /* Disposición simétrica 2x2 */
        gap: 8px !important;
      }
      .btn-sun-action, #page-num {
        width: 100%;
        min-width: 0;
      }
      .flipbook-viewport {
        padding: 10px 2px;
        min-height: 400px;
      }
    }
  </style>
</head>
<body class="bg-light">

  <main class="container-fluid my-3 px-2 px-md-5" style="max-width: 1300px;">
    
    <!-- Navegación -->
    <nav aria-label="breadcrumb" class="mb-3 d-flex align-items-center gap-2">
      <a href="index.html" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Volver a Inicio
      </a>
    </nav>

    <!-- Ficha Principal -->
    <article class="bg-white p-3 p-md-4 rounded shadow-sm border">
      
      <!-- Encabezado con cabezal compacto -->
      <header class="pb-2 mb-3 border-bottom">
        <div class="header-container mb-2">
          <img src="img/cientifico.jpg" alt="Publicación SUN" class="header-img">
          
          <div class="header-overlay">
            <span class="badge bg-primary mb-1" style="font-size: 0.75rem;">Publicación Interactiva</span>
            <h1 class="fw-bold text-white mb-0" id="doc-title-text">Revista SUN</h1>
          </div>
        </div>

        <!-- LÍNEA DE ACCIONES E INDICADOR DE PÁGINA -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 pt-1 action-bar-container">
          <p class="text-muted small mb-0">Podés hojear el documento en pantalla o descargarlo en formato PDF original.</p>
          
          <div class="d-flex align-items-center gap-2 action-buttons-group">
            <!-- Contador de Paginado -->
            <span id="page-num">Cargando...</span>

            <!-- Botón Pág. 1 -->
            <button id="btn-first-page" class="btn-sun-action" title="Ir a la Portada / Primera Página">
              <i class="bi bi-journal-arrow-up"></i> Pág. 1
            </button>

            <!-- Pantalla Completa -->
            <button id="btn-fullscreen" class="btn-sun-action">
              <i class="bi bi-arrows-angle-expand"></i> Pantalla Completa
            </button>

            <!-- Descargar PDF -->
            <a id="btn-download" href="#" download class="btn-sun-action">
              <i class="bi bi-download"></i> Descargar PDF
            </a>
          </div>
        </div>
      </header>

      <!-- ÁREA DEL LIBRO INTERACTIVO + FLECHAS -->
      <div class="flipbook-wrapper">
        <button id="btn-prev" class="btn-sun-circle" title="Página Anterior">
          <i class="bi bi-chevron-left"></i>
        </button>

        <section class="flipbook-viewport border" id="viewport-container">
          <div id="loading-status" class="alert alert-info mb-0">
            <i class="bi bi-arrow-repeat spin me-2"></i> Procesando documento interactivo...
          </div>
          <div id="my-flipbook"></div>
        </section>

        <button id="btn-next" class="btn-sun-circle" title="Página Siguiente">
          <i class="bi bi-chevron-right"></i>
        </button>
      </div>

      <!-- Pie de página -->
      <footer class="border-top pt-3 mt-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
        <span class="text-muted small">Sociedad Uruguaya de Nefrología</span>
        <a href="index.html" class="btn btn-sm btn-outline-primary fw-bold">
          Sitio Oficial SUN <i class="bi bi-box-arrow-up-right ms-1"></i>
        </a>
      </footer>

    </article>

  </main>

  <!-- JS de Bootstrap 5 y jQuery (Requerido por Turn.js) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- LIBRERÍAS DE FLIPBOOK (PDF.js + Turn.js) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/blasten/turn.js/turn.min.js"></script>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const urlParams = new URLSearchParams(window.location.search);
    const pdfPath = urlParams.get('doc') || 'publicaciones-pdf/articulo-cientifico-1.pdf';

    document.getElementById('btn-download').href = pdfPath;

    let totalPdfPages = 0;
    const $flipbook = $('#my-flipbook');

    async function initPDFViewer() {
      const loadingEl = document.getElementById('loading-status');
      const viewportEl = document.getElementById('viewport-container');

      try {
        const loadingTask = pdfjsLib.getDocument(pdfPath);
        const pdfDoc = await loadingTask.promise;
        totalPdfPages = pdfDoc.numPages;

        $flipbook.empty();
        const isMobile = $(window).width() <= 768;

        // Obtener la proporción exacta del PDF desde la página 1
        const firstPage = await pdfDoc.getPage(1);
        const pdfViewport = firstPage.getViewport({ scale: 1.0 });
        const aspectRatio = pdfViewport.height / pdfViewport.width;

        // Obtener ancho real disponible
        const availableWidth = viewportEl.clientWidth - (isMobile ? 10 : 30);

        let singlePageWidth, bookWidth, bookHeight;

        if (isMobile) {
          singlePageWidth = availableWidth;
          bookWidth = singlePageWidth;
          bookHeight = singlePageWidth * aspectRatio;
        } else {
          singlePageWidth = Math.min(450, availableWidth / 2);
          bookWidth = singlePageWidth * 2;
          bookHeight = singlePageWidth * aspectRatio;
        }

        // Renderizar páginas en canvas con alta resolución
        for (let pageNum = 1; pageNum <= totalPdfPages; pageNum++) {
          const page = await pdfDoc.getPage(pageNum);
          
          const scale = (singlePageWidth / pdfViewport.width) * 2;
          const viewport = page.getViewport({ scale: scale });

          const pageDiv = document.createElement('div');
          pageDiv.className = 'page';

          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          pageDiv.appendChild(canvas);
          $flipbook.append(pageDiv);

          await page.render({ canvasContext: context, viewport: viewport }).promise;
        }

        // Inicializar Turn.js
        $flipbook.turn({
          width: bookWidth,
          height: bookHeight,
          autoCenter: true,
          display: isMobile ? 'single' : 'double',
          acceleration: true,
          elevation: 50,
          gradients: true,
          when: {
            turned: function(event, page) {
              updatePageIndicator(page);
            }
          }
        });

        loadingEl.style.display = 'none';
        $flipbook.addClass('loaded');

        updatePageIndicator(1);

      } catch (error) {
        console.error('Error al cargar el PDF:', error);
        loadingEl.className = 'alert alert-danger mb-0';
        loadingEl.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-2"></i> Error al cargar el PDF.';
      }
    }

    function updatePageIndicator(page) {
      document.getElementById('page-num').innerText = `Pág. ${page} de ${totalPdfPages}`;
    }

    // Controles laterales
    document.getElementById('btn-prev').addEventListener('click', () => {
      $flipbook.turn('previous');
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      $flipbook.turn('next');
    });

    // Control Pág. 1
    document.getElementById('btn-first-page').addEventListener('click', () => {
      $flipbook.turn('page', 1);
    });

    // Pantalla Completa
    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    window.addEventListener('DOMContentLoaded', initPDFViewer);
  </script>
</body>
</html>
